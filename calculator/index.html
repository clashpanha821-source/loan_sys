<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav>
        <a href="../" >ទំព័រដើម</a>
        <a href="../calculator/" class="active">គណនាប្រាក់កម្ចី</a>
        <a href="../apply/">ដាក់ពាក្យស្នើសុំ</a>
        <a href="../details/">ព័ត៌មានលម្អិត</a>
        <a href="../licenses/">អាជ្ញាប័ណ្ណ</a>
    </nav>
    <div class="container">
        <div id="calculator" class="page">
                <h2>គណនាប្រាក់កម្ចី (អត្រាការប្រាក់ 0.3% / ខែ)</h2>
                <div class="form-group">
                    <label>ទឹកប្រាក់ដែលចង់ខ្ចី ($):</label>
                    <input type="number" id="calc-amount" placeholder="ឧទាហរណ៍៖ 1000">
                </div>
                <div class="form-group">
                    <label>ចំនួនខែដែលត្រូវបង់សង:</label>
                    <input type="number" id="calc-months" placeholder="ឧទាហរណ៍៖ 12">
                </div>
                <button onclick="calculateLoan()">គណនា</button>

                <div id="calc-result" class="result-box" style="display: none;">
                    <p>ទឹកប្រាក់ស្នើសុំ៖ <span id="res-amount" class="highlight">0$</span></p>
                    <p>ការប្រាក់សរុប (0.3% x ចំនួនខែ)៖ <span id="res-interest" class="highlight">0$</span></p>
                    <hr>
                    <p>ប្រាក់សរុបដែលត្រូវបង់សងត្រឡប់មកវិញ៖ <strong id="res-total" class="highlight" style="font-size: 22px;">0$</strong></p>
                </div>
            </div>
        </div>    
    <script>
        function calculateLoan() {
            let amountInput = document.getElementById('calc-amount').value;
            let monthsInput = document.getElementById('calc-months').value;

            let amount = parseFloat(amountInput);
            let months = parseInt(monthsInput);

            if (isNaN(amount) || amount <= 0 || isNaN(months) || months <= 0) {
                alert("សូមបញ្ចូលចំនួនទឹកប្រាក់ និងចំនួនខែឲ្យបានត្រឹមត្រូវ!");
                return;
            }

            
            let interestRate = 0.003;
            let totalInterest = amount * interestRate * months;
            let totalPayment = amount + totalInterest;

            
            document.getElementById('res-amount').innerText = amount.toFixed(2) + " $";
            document.getElementById('res-interest').innerText = totalInterest.toFixed(2) + " $";
            document.getElementById('res-total').innerText = totalPayment.toFixed(2) + " $";
            
            document.getElementById('calc-result').style.display = 'block';
        }
    </script>
</body>
</html>
